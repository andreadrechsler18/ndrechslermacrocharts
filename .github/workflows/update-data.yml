name: Update Economic Data

on:
  schedule:
    # Run 5 min after each release time. Two entries per slot (EST + EDT)
    # so the correct one fires year-round. The Python script checks ET time
    # and skips sources whose release hasn't happened yet.
    #
    # BLS/BEA/NY Fed/Philly Fed release at 8:30 AM ET → fetch at 8:35 AM ET
    - cron: '35 12 * * 1-5'   # 8:35 AM EDT (Mar-Nov)
    - cron: '35 13 * * 1-5'   # 8:35 AM EST (Nov-Mar)
    # FRED IP releases at 9:15 AM ET → fetch at 9:20 AM ET
    - cron: '20 13 * * 1-5'   # 9:20 AM EDT (Mar-Nov)
    - cron: '20 14 * * 1-5'   # 9:20 AM EST (Nov-Mar)
    # Census/Richmond Fed release at 10:00 AM ET → fetch at 10:05 AM ET
    - cron: '5 14 * * 1-5'    # 10:05 AM EDT (Mar-Nov)
    - cron: '5 15 * * 1-5'    # 10:05 AM EST (Nov-Mar)
    # Dallas Fed (10:30 CT) / KC Fed (11:00 CT) → fetch at 12:05 PM ET
    - cron: '5 16 * * 1-5'    # 12:05 PM EDT (Mar-Nov)
    - cron: '5 17 * * 1-5'    # 12:05 PM EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run full pipeline (ignore calendar)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Refresh the release calendar on days 1-3 of each month. Runs BEFORE the
  # update job so that if BLS/etc. shift a release day (e.g. Jul 4 falls on
  # a weekend), the corrected calendar is in place before the fetchers decide
  # what to pull.
  refresh-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check if first weekday of month
        id: check
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le "3" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Refresh release calendar
        if: steps.check.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_calendar.py

      - name: Commit calendar
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/release_calendar.json
          git diff --cached --quiet || git commit -m "Refresh release calendar $(date -u +%Y-%m)"
          git push || true

  update:
    runs-on: ubuntu-latest
    needs: refresh-calendar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scheduled update
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.force_full }}" = "true" ]; then
            echo "Force full pipeline requested"
            python scripts/fetch_all.py
          else
            python scripts/run_scheduled.py
          fi

      - name: Copy updated data to docs
        run: rsync -av --delete data/json/ docs/data/

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/json/ docs/data/
          git commit -m "Auto-update economic data $(date -u +%Y-%m-%d)"
          # Handle conflicts when remote changed the same data files.
          # Copy fresh data aside, reset to remote HEAD, restore data, recommit.
          if ! git pull --rebase origin master; then
            echo "Rebase conflict — saving data and resetting to remote..."
            git rebase --abort
            cp -r data/json/ /tmp/fresh-data/
            cp -r docs/data/ /tmp/fresh-docs/
            git reset --hard origin/master
            cp -r /tmp/fresh-data/* data/json/
            cp -r /tmp/fresh-docs/* docs/data/
            git add data/json/ docs/data/
            git diff --cached --quiet || git commit -m "Auto-update economic data $(date -u +%Y-%m-%d)"
          fi
          git push
