<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOLTS - Job Openings and Labor Turnover - NDMacroCharts</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
</head>
<body>
  <nav id="main-nav"></nav>
  <main>
    <header class="page-header">
      <h1>Job Openings and Labor Turnover (JOLTS)</h1>
      <div class="controls" id="chart-controls"></div>
    </header>
    <div class="chart-grid" id="chart-grid"></div>
  </main>
  <script src="../js/nav.js?v=6"></script>
  <script src="../js/controls.js?v=3"></script>
  <script src="../js/lazyload.js?v=3"></script>
  <script src="../js/charts.js?v=7"></script>
  <script>
    NewCoCharts.init({
      dataUrl: '../data/jolts/jolts.json',
      defaultMode: 'raw',
      defaultHorizon: 60,
      chartType: 'line',
      filterType: 'suffix',
      filters: [
        { separator: 'Levels' },
        { key: '_JOL', label: 'Job Openings' },
        { key: '_HIL', label: 'Hires' },
        { key: '_TSL', label: 'Total Separations' },
        { key: '_QUL', label: 'Quits' },
        { key: '_LDL', label: 'Layoffs & Discharges' },
        { separator: 'Rates' },
        { key: '_JOR', label: 'Job Openings' },
        { key: '_HIR', label: 'Hires' },
        { key: '_TSR', label: 'Total Separations' },
        { key: '_QUR', label: 'Quits' },
        { key: '_LDR', label: 'Layoffs & Discharges' }
      ],
      modes: [
        { key: 'raw', label: 'Raw Data' },
        { key: 'yoy', label: 'YoY % Change' }
      ]
    });
  </script>
</body>
</html>
