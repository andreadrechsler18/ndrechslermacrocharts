<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 - NDMacroCharts</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* M3 page only — let vertical touch swipes scroll the page instead of
       being captured by Plotly. Applied at <=768px so desktop is untouched. */
    @media (max-width: 768px) {
      .chart-container,
      .chart-container * {
        touch-action: pan-y;
      }
    }
  </style>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
</head>
<body>
  <nav id="main-nav"></nav>
  <main>
    <header class="page-header">
      <h1>Manufacturers' Shipments, Inventories, and Orders</h1>
      <div class="controls" id="chart-controls"></div>
    </header>
    <div class="chart-grid" id="chart-grid"></div>
  </main>
  <script src="../js/nav.js?v=3"></script>
  <script src="../js/controls.js?v=3"></script>
  <script src="../js/lazyload.js?v=3"></script>
  <script src="../js/charts.js?v=4"></script>
  <script>
    NewCoCharts.init({
      dataUrl: '../data/m3/m3.json',
      defaultMode: 'yoy',
      defaultHorizon: 24,
      filterType: 'suffix',
      excludePatterns: ['_MPC', '_IS'],
      computedRatios: [
        { numeratorSuffix: '_NO', denominatorSuffix: '_VS', resultSuffix: '_BB', resultNameSuffix: 'Book:Bill Ratio' }
      ],
      filters: [
        { key: '_VS', label: 'Shipments' },
        { key: '_NO', label: 'Orders' },
        { key: '_UO', label: 'Unfilled Orders' },
        { key: '_TI,_FI,_MI,_WI', label: 'Inventories' },
        { key: '_BB', label: 'Book:Bill' }
      ]
    });
  </script>
</body>
</html>
