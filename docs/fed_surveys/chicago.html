<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fed Surveys - Chicago - NDMacroCharts</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
</head>
<body>
  <nav id="main-nav"></nav>
  <main>
    <header class="page-header">
      <h1>Chicago Fed Survey of Economic Conditions</h1>
      <div class="controls" id="chart-controls"></div>
    </header>
    <div class="chart-grid" id="chart-grid"></div>
  </main>
  <script src="../js/nav.js?v=6"></script>
  <script src="../js/controls.js?v=3"></script>
  <script src="../js/lazyload.js?v=3"></script>
  <script src="../js/charts.js?v=8"></script>
  <script>
    NewCoCharts.init({
      dataUrl: '../data/fed_surveys/fed_chicago.json',
      defaultMode: 'raw',
      defaultHorizon: 0,
      chartType: 'line',
      modes: [
        { key: 'raw', label: 'Index Value' }
      ]
    });
  </script>
</body>
</html>
