<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSS Health Care - NDMacroCharts</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
</head>
<body>
  <nav id="main-nav"></nav>
  <main>
    <header class="page-header">
      <h1>QSS Health Care (NAICS 62) - Revenue, Expenses, Profit</h1>
      <div class="controls" id="chart-controls"></div>
    </header>
    <div class="chart-grid" id="chart-grid"></div>
  </main>
  <script src="../js/nav.js?v=8"></script>
  <script src="../js/controls.js?v=3"></script>
  <script src="../js/lazyload.js?v=3"></script>
  <script src="../js/charts.js?v=10"></script>
  <script>
    NewCoCharts.init({
      dataUrl: '../data/qss/qss_health.json',
      defaultMode: 'raw',
      defaultHorizon: 0,
      dateAlignment: 'quarter-end',
      filterType: 'suffix',
      filters: [
        { key: '_REV', label: 'Revenue' },
        { key: '_EXP', label: 'Expenses' },
        { key: '_PROFIT', label: 'Profit' },
        { key: '_MARGIN', label: 'Margin' },
        { key: '_MARGIN_TTM', label: 'TTM Margin' }
      ],
      modes: [
        { key: 'raw', label: 'Raw Data' },
        { key: 'yoy', label: 'YoY % Change' },
        { key: 'pct', label: '% of Total' },
        { key: 'ttm_raw', label: 'Trailing 12-Mo Sum' },
        { key: 'ttm', label: 'Trailing 12-Mo YoY' },
        { key: 'ttm_pct', label: 'TTM % of Total' }
      ],
      totalSeriesBySuffix: {
        '_REV': '62A_REV',
        '_EXP': '62A_EXP',
        '_PROFIT': '62A_PROFIT',
        '_MARGIN': '62A_MARGIN',
        '_MARGIN_TTM': '62A_MARGIN_TTM'
      }
    });
  </script>
</body>
</html>
